name: Build Mobile

on:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "electron.vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "electron.vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

env:
  NODE_VERSION: 22.x

jobs:
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint and type check
        run: |
          pnpm lint
          pnpm typecheck
      - name: Build web assets
        run: pnpm exec electron-vite build
      - name: Remove compressed web assets for Android
        run: find out/renderer -type f -name "*.gz" -delete
      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build Android APK
        run: ./android/gradlew -p android assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: splayer-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS unsigned IPA build
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build web assets
        run: pnpm exec electron-vite build
      - name: Sync Capacitor iOS project
        run: pnpm exec cap sync ios
      - name: Build unsigned iOS app
        run: >-
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath ios/build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build
      - name: Package unsigned IPA
        run: |
          mkdir -p ios/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/App.app ios/Payload/App.app
          cd ios
          zip -r splayer-ios-unsigned.ipa Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: splayer-ios-unsigned
          path: ios/splayer-ios-unsigned.ipa
